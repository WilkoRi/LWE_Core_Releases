<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LWE Control</title>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <p class="eyebrow">Local Website Editor</p>
          <h1>LWE Control</h1>
        </div>
        <span id="statusBadge" class="badge">Inactief</span>
      </header>

      <section class="panel">
        <dl class="status-list">
          <div>
            <dt>Projectmap</dt>
            <dd id="projectPath">-</dd>
          </div>
          <div>
            <dt>Server</dt>
            <dd id="serverStatus">-</dd>
          </div>
          <div>
            <dt>Poort</dt>
            <dd id="port">-</dd>
          </div>
        </dl>
      </section>

      <section class="panel">
        <h2>Server</h2>
        <p class="hint">Start de lokale LWE-server voor deze projectmap.</p>
        <div class="actions">
          <button id="startButton">Start</button>
          <button id="stopButton" class="secondary">Stop</button>
          <button id="restartButton" class="secondary">Herstart</button>
        </div>
      </section>

      <section class="panel">
        <h2>Openen</h2>
        <p class="hint">Open daarna de website of de web editor in je browser.</p>
        <div class="actions">
          <button id="openEditorButton">Open web editor</button>
          <button id="openWebsiteButton" class="secondary">Open website</button>
          <button id="openManualButton" class="secondary">Open manual</button>
        </div>
      </section>

      <section class="panel">
        <h2>Afsluiten</h2>
        <p class="hint">Stop de lokale server en sluit LWE Control.</p>
        <div class="actions">
          <button id="quitButton" class="secondary danger">Sluit LWE Control</button>
        </div>
      </section>

      <p id="message" class="message" role="status"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
